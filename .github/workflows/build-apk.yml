name: Build APK

on:
  push:
    branches: [ "feature/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dev.jks"
            echo "DEV_KEYSTORE_FILE=$RUNNER_TEMP/dev.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::DEV_KEYSTORE_BASE64 secret not set; using a throwaway debug key"
          fi
      - name: Build dev APK (shrunk)
        shell: bash
        env:
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDev 2>&1 | tee build.log
      - name: Rename APK
        run: cp app/build/outputs/apk/dev/*.apk comfymobile-dev.apk && ls -lh comfymobile-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: comfychair-debug-apk
          path: comfymobile-dev.apk
      # Fixed public download link:
      # https://github.com/<owner>/<repo>/releases/download/dev-latest/comfymobile-dev.apk
      - name: Publish to dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev-latest
          git push -f origin dev-latest
          gh release view dev-latest >/dev/null 2>&1 || \
            gh release create dev-latest --prerelease --title "Dev build (latest)" --notes "Latest test build from feature branches."
          gh release edit dev-latest --notes "Latest test build: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          gh release upload dev-latest comfymobile-dev.apk --clobber
      # On failure, publish the compiler errors so they can be read without logging in
      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -300 > build-errors.txt || true
          gh release view dev-latest >/dev/null 2>&1 || gh release create dev-latest --prerelease --title "Dev build (latest)" --notes "Latest test build."
          gh release upload dev-latest build-errors.txt --clobber
